# Optional local infra. The default dev setup uses a hosted Postgres (Neon /
# Supabase) — see README. Use this only if you'd rather run Postgres locally and
# have Docker installed.
services:
  postgres:
    image: postgres:16-alpine
    container_name: iskool_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: iskool
      POSTGRES_PASSWORD: iskool
      POSTGRES_DB: iskool
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iskool -d iskool"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: iskool_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
