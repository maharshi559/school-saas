<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; }
  </style>
</helmet>
<div style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #f8fafc; padding: 40px 20px;">
  <div style="width: 100%; max-width: 600px;">

    <!-- Top Bar -->
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 0; margin-bottom: 40px; border-bottom: 1px solid #e2e8f0;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <div style="width: 36px; height: 36px; border-radius: 6px; background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%); display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 16px;">S</div>
      </div>
      <button style="padding: 8px 12px; background: transparent; color: #64748b; border: none; font-size: 14px; cursor: pointer;">Sign out</button>
    </div>

    <!-- Alert -->
    <div style="border-radius: 8px; border: 1px solid #fecaca; background: #fef2f2; padding: 16px; margin-bottom: 32px;">
      <div style="font-size: 13px; font-weight: 500; color: #991b1b; margin-bottom: 4px;">Not linked to a school</div>
      <p style="margin: 0; font-size: 14px; color: #7f1d1d; line-height: 1.5;">Your number isn't linked to a school yet. Ask your school admin to add you, or register with a school code.</p>
    </div>

    <!-- Info Card -->
    <div style="background: white; border-radius: 8px; border: 1px solid #e2e8f0; padding: 24px;">
      <h2 style="margin: 0 0 16px 0; font-size: 16px; font-weight: 600; color: #0f172a;">What to do next</h2>
      <div style="space-y: 12px;">
        <div style="display: flex; gap: 12px; padding: 12px 0;">
          <div style="font-size: 18px; line-height: 1.4;">📧</div>
          <div style="flex: 1;">
            <div style="font-size: 14px; font-weight: 500; color: #0f172a;">Contact your admin</div>
            <p style="margin: 4px 0 0 0; font-size: 13px; color: #64748b;">Ask them to add your phone number to the school</p>
          </div>
        </div>
        <div style="display: flex; gap: 12px; padding: 12px 0;">
          <div style="font-size: 18px; line-height: 1.4;">🔐</div>
          <div style="flex: 1;">
            <div style="font-size: 14px; font-weight: 500; color: #0f172a;">Use a school code</div>
            <p style="margin: 4px 0 0 0; font-size: 13px; color: #64748b;">Ask your admin for the school code to register</p>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
