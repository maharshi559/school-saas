<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; }
  </style>
</helmet>
<div style="width: 100%; height: 100%; display: flex; flex-direction: column; background: #f8fafc; padding: 16px;">

  <!-- Header -->
  <div style="background: white; border-radius: 8px; padding: 16px; margin-bottom: 16px;">
    <h1 style="margin: 0 0 4px 0; font-size: 18px; font-weight: 600; color: #0f172a;">Today's Classes</h1>
    <p style="margin: 0; font-size: 12px; color: #64748b;">15 Jan 2026</p>
  </div>

  <!-- Classes List -->
  <div style="flex: 1; overflow-y: auto;">

    <!-- Class Card -->
    <div style="background: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; margin-bottom: 12px;">
      <div style="display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px;">
        <div>
          <h3 style="margin: 0 0 4px 0; font-size: 16px; font-weight: 600; color: #0f172a;">Grade 1 A</h3>
          <p style="margin: 0; font-size: 12px; color: #64748b;">9:00 AM - 10:00 AM</p>
        </div>
        <div style="display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; color: #0d9488;">✓ Attended</div>
      </div>
      <button style="width: 100%; padding: 10px 12px; background: #0d9488; color: white; border: none; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer;">Take attendance</button>
    </div>

    <!-- Class Card -->
    <div style="background: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; margin-bottom: 12px;">
      <div style="display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px;">
        <div>
          <h3 style="margin: 0 0 4px 0; font-size: 16px; font-weight: 600; color: #0f172a;">Grade 2 B</h3>
          <p style="margin: 0; font-size: 12px; color: #64748b;">10:15 AM - 11:15 AM</p>
        </div>
        <div style="display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; color: #f59e0b;">⧖ Coming soon</div>
      </div>
      <button style="width: 100%; padding: 10px 12px; background: white; color: #64748b; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; opacity: 0.5;" disabled>Take attendance</button>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
