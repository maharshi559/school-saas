<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; }
  </style>
</helmet>
<div style="width: 100%; height: 100%; padding: 32px; overflow-y: auto;">

  <!-- Back Button -->
  <button style="background: transparent; border: none; color: #0d9488; font-size: 14px; font-weight: 500; cursor: pointer; margin-bottom: 24px;">← Back to Students</button>

  <!-- Student Header -->
  <div style="background: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 24px; margin-bottom: 24px;">
    <div style="display: flex; gap: 20px; align-items: flex-start;">
      <div style="width: 80px; height: 80px; border-radius: 8px; background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%); display: flex; align-items: center; justify-content: center; color: white; font-size: 28px; font-weight: 700;">A</div>
      <div style="flex: 1;">
        <h1 style="margin: 0 0 4px 0; font-size: 24px; font-weight: 600; color: #0f172a;">Aarav Sharma</h1>
        <div style="font-size: 14px; color: #64748b; margin-bottom: 12px;">
          <div>Admission No. <span style="font-family: 'SF Mono', Monaco, monospace; font-weight: 500;">ADM10001</span></div>
          <div>Class: Grade 1 A</div>
          <div>D.O.B: 15 May 2018</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Guardians -->
  <div style="background: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 24px; margin-bottom: 24px;">
    <h2 style="margin: 0 0 16px 0; font-size: 16px; font-weight: 600; color: #0f172a;">Guardians</h2>
    <div style="border-bottom: 1px solid #f1f5f9; padding: 12px 0; margin-bottom: 12px;">
      <div style="font-size: 14px; font-weight: 500; color: #0f172a;">Priya Sharma</div>
      <div style="font-size: 12px; color: #64748b;">Mother (Primary)</div>
      <div style="font-size: 12px; font-family: 'SF Mono', Monaco, monospace; color: #94a3b8;">+91 9876543210</div>
    </div>
  </div>

  <!-- Consent Status -->
  <div style="background: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 24px;">
    <h2 style="margin: 0 0 16px 0; font-size: 16px; font-weight: 600; color: #0f172a;">Consent Status</h2>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
      <div style="padding: 12px; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 6px;">
        <div style="font-size: 12px; color: #166534; font-weight: 500;">General Data</div>
        <div style="font-size: 12px; color: #16a34a; margin-top: 4px;">✓ Granted</div>
      </div>
      <div style="padding: 12px; background: #fef2f2; border: 1px solid #fecaca; border-radius: 6px;">
        <div style="font-size: 12px; color: #991b1b; font-weight: 500;">AI Processing</div>
        <div style="font-size: 12px; color: #dc2626; margin-top: 4px;">✗ Declined</div>
      </div>
      <div style="padding: 12px; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 6px;">
        <div style="font-size: 12px; color: #166534; font-weight: 500;">WhatsApp</div>
        <div style="font-size: 12px; color: #16a34a; margin-top: 4px;">✓ Granted</div>
      </div>
      <div style="padding: 12px; background: #fef2f2; border: 1px solid #fecaca; border-radius: 6px;">
        <div style="font-size: 12px; color: #991b1b; font-weight: 500;">SMS</div>
        <div style="font-size: 12px; color: #dc2626; margin-top: 4px;">✗ Declined</div>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
