<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; }
    button { cursor: pointer; }
  </style>
</helmet>
<div style="width: 100%; height: 100%; display: flex; flex-direction: column; background: #f8fafc; padding: 16px;">

  <!-- Header -->
  <div style="background: white; border-radius: 8px; padding: 16px; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between;">
    <h1 style="margin: 0; font-size: 18px; font-weight: 600; color: #0f172a;">Your Children</h1>
    <button style="padding: 8px 12px; background: white; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 12px; color: #64748b;">Sign out</button>
  </div>

  <!-- Child Switcher -->
  <div style="display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding: 0 0 8px 0;">
    <button onclick="{{setChild}}" data-child="aarav" style="padding: 8px 16px; background: {{selectedChild === 'aarav' ? '#0d9488' : 'white'}}; color: {{selectedChild === 'aarav' ? 'white' : '#64748b'}}; border: 1px solid {{selectedChild === 'aarav' ? '#0d9488' : '#e2e8f0'}}; border-radius: 20px; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap;">Aarav Sharma</button>
    <button onclick="{{setChild}}" data-child="diya" style="padding: 8px 16px; background: {{selectedChild === 'diya' ? '#0d9488' : 'white'}}; color: {{selectedChild === 'diya' ? 'white' : '#64748b'}}; border: 1px solid {{selectedChild === 'diya' ? '#0d9488' : '#e2e8f0'}}; border-radius: 20px; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap;">Diya Patel</button>
  </div>

  <!-- Child Summary -->
  <div style="flex: 1; overflow-y: auto;">

    <!-- Attendance Summary -->
    <div style="background: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; margin-bottom: 12px;">
      <h3 style="margin: 0 0 12px 0; font-size: 14px; font-weight: 600; color: #0f172a;">This Month</h3>
      <div style="display: flex; gap: 12px;">
        <div style="flex: 1;">
          <div style="font-size: 12px; color: #94a3b8; margin-bottom: 4px;">Attendance</div>
          <div style="font-size: 28px; font-weight: 600; font-family: 'SF Mono', Monaco, monospace; color: #0f172a;">94%</div>
        </div>
        <div style="flex: 1;">
          <div style="font-size: 12px; color: #94a3b8; margin-bottom: 4px;">Days Present</div>
          <div style="font-size: 28px; font-weight: 600; font-family: 'SF Mono', Monaco, monospace; color: #0f172a;">19</div>
        </div>
      </div>
    </div>

    <!-- Quick Links -->
    <div style="background: white; border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden;">
      <button style="width: 100%; padding: 12px 16px; background: white; border: none; border-bottom: 1px solid #f1f5f9; text-align: left; font-size: 14px; font-weight: 500; color: #0f172a; cursor: pointer;">View attendance history</button>
      <button style="width: 100%; padding: 12px 16px; background: white; border: none; border-bottom: 1px solid #f1f5f9; text-align: left; font-size: 14px; font-weight: 500; color: #0f172a; cursor: pointer;">View grades (coming soon)</button>
      <button style="width: 100%; padding: 12px 16px; background: white; border: none; text-align: left; font-size: 14px; font-weight: 500; color: #0f172a; cursor: pointer;">Manage consent & preferences</button>
    </div>

  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { selectedChild: 'aarav' };
  }

  renderVals() {
    return {
      selectedChild: this.state.selectedChild,
      setChild: (e) => {
        const child = e.target.dataset.child;
        this.setState({ selectedChild: child });
      }
    };
  }
}
</script>
</body>
</html>
