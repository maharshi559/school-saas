<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; }
  </style>
</helmet>
<div style="width: 100%; height: 100%; padding: 16px; overflow-y: auto;">

  <!-- Header -->
  <div style="background: white; border-radius: 8px; padding: 16px; margin-bottom: 16px;">
    <button style="background: transparent; border: none; color: #0d9488; font-size: 14px; font-weight: 500; cursor: pointer; margin-bottom: 12px;">← Back</button>
    <h1 style="margin: 0 0 4px 0; font-size: 18px; font-weight: 600; color: #0f172a;">Aarav Sharma</h1>
    <p style="margin: 0; font-size: 12px; color: #64748b;">Attendance History</p>
  </div>

  <!-- Stats -->
  <div style="background: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; margin-bottom: 16px;">
    <div style="display: flex; gap: 12px;">
      <div style="flex: 1;">
        <div style="font-size: 12px; color: #94a3b8; margin-bottom: 4px;">Present</div>
        <div style="font-size: 24px; font-weight: 600; font-family: 'SF Mono', Monaco, monospace; color: #16a34a;">19</div>
      </div>
      <div style="width: 1px; background: #e2e8f0;"></div>
      <div style="flex: 1;">
        <div style="font-size: 12px; color: #94a3b8; margin-bottom: 4px;">Absent</div>
        <div style="font-size: 24px; font-weight: 600; font-family: 'SF Mono', Monaco, monospace; color: #dc2626;">1</div>
      </div>
      <div style="width: 1px; background: #e2e8f0;"></div>
      <div style="flex: 1;">
        <div style="font-size: 12px; color: #94a3b8; margin-bottom: 4px;">Late</div>
        <div style="font-size: 24px; font-weight: 600; font-family: 'SF Mono', Monaco, monospace; color: #f59e0b;">0</div>
      </div>
    </div>
  </div>

  <!-- Timeline -->
  <div style="background: white; border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden;">
    <div style="border-bottom: 1px solid #f1f5f9; padding: 12px 16px;">
      <div style="font-size: 12px; color: #94a3b8; margin-bottom: 4px;">15 Jan 2026</div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <div style="width: 6px; height: 6px; border-radius: 50%; background: #16a34a;"></div>
        <span style="font-size: 14px; color: #0f172a;">Present</span>
      </div>
    </div>
    <div style="border-bottom: 1px solid #f1f5f9; padding: 12px 16px;">
      <div style="font-size: 12px; color: #94a3b8; margin-bottom: 4px;">14 Jan 2026</div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <div style="width: 6px; height: 6px; border-radius: 50%; background: #16a34a;"></div>
        <span style="font-size: 14px; color: #0f172a;">Present</span>
      </div>
    </div>
    <div style="border-bottom: 1px solid #f1f5f9; padding: 12px 16px;">
      <div style="font-size: 12px; color: #94a3b8; margin-bottom: 4px;">13 Jan 2026</div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <div style="width: 6px; height: 6px; border-radius: 50%; background: #dc2626;"></div>
        <span style="font-size: 14px; color: #0f172a;">Absent</span>
      </div>
    </div>
    <div style="padding: 12px 16px;">
      <div style="font-size: 12px; color: #94a3b8; margin-bottom: 4px;">12 Jan 2026</div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <div style="width: 6px; height: 6px; border-radius: 50%; background: #16a34a;"></div>
        <span style="font-size: 14px; color: #0f172a;">Present</span>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
